name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2


      - name: Cargo Check
        run: |
          cargo check --verbose 2>&1 | tee cargo_check.log

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-${{ matrix.os }}-log
          path: cargo_check.log


      - name: Cargo Test
        run: |
          cargo test --verbose 2>&1 | tee cargo_test.log

      - name: Upload Test Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-${{ matrix.os }}-log
          path: |
            cargo_check.log
            cargo_test.log



